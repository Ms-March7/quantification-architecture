name: Fundamental research

on:
  push:
    paths:
      - 'news-signal-agent/**'
      - '.github/workflows/fundamental-research.yml'
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Research cutoff with time zone; leave blank for a current public-feed refresh'
        default: '2026-05-21T18:00:00+08:00'
        required: false
        type: string
      since:
        description: 'Optional earlier cutoff to compare'
        default: '2026-03-26T18:00:00+08:00'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: news-signal-agent/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Prepare test environment on the runner
        run: python -m pip install "pydantic>=2.7,<3" "httpx>=0.27,<1" "PyYAML>=6,<7" "pytest>=8,<10"
      - name: Run backend tests
        run: python -m pytest -q
      - name: Generate research brief
        env:
          EVENT_NAME: ${{ github.event_name }}
          AS_OF: ${{ inputs.as_of }}
          SINCE: ${{ inputs.since }}
        run: |
          args=()
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            args+=(--as-of '2026-05-21T18:00:00+08:00' --since '2026-03-26T18:00:00+08:00')
          else
            if [[ -n "$AS_OF" ]]; then args+=(--as-of "$AS_OF"); else args+=(--refresh); fi
            if [[ -n "$SINCE" ]]; then args+=(--since "$SINCE"); fi
          fi
          python -m app.fundamental ../config/examples/inference_memory.yaml "${args[@]}" --output "$RUNNER_TEMP/research.md"
      - name: Save the Markdown report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fundamental-research-brief
          path: ${{ runner.temp }}/research.md
          if-no-files-found: error
