# Fictional teaching case. All documents, quotes and times are synthetic.
synthetic: true
question: 存储涨价能否持续改善示例厂商毛利，并支撑更高的估值？
opened_at: &opened 2026-04-20T09:00:00+08:00
nodes:
  - {id: spot, kind: observation, label: 固定规格行业现货报价, recorded_at: *opened}
  - {id: asp, kind: hypothesis, label: 公司合约售价上升, recorded_at: *opened}
  - {id: margin, kind: hypothesis, label: 产品毛利改善可持续, recorded_at: *opened}
  - {id: valuation, kind: conclusion, label: 估值能够由持续盈利支撑, recorded_at: *opened}
  - {id: restocking, kind: observation, label: 客户提前备货, recorded_at: &buyer_review 2026-05-12T09:30:00+08:00}
  - {id: shipments, kind: hypothesis, label: 本期出货增加, recorded_at: *buyer_review}
  - {id: foundry, kind: observation, label: 晶圆采购成本调整, recorded_at: &later 2026-05-15T11:00:00+08:00}
edges:
  - {id: repricing, from_node: spot, to_node: asp, effect: supports, condition: 产品规格可比，现货变动传导到公司合约结算价。, next_check: 查同规格合约的实际结算价和客户覆盖范围。, recorded_at: *opened}
  - {id: price_margin, from_node: asp, to_node: margin, effect: supports, condition: 产品结构稳定且单位成本增幅小于售价增幅。, recorded_at: *opened}
  - {id: valuation_link, from_node: margin, to_node: valuation, effect: supports, condition: 利润改善的持续期足以支撑估值中隐含的盈利要求。, next_check: 按估值对应的盈利假设反推所需毛利水平，对照公司已披露的产品结构。, recorded_at: *opened}
  - {id: pull_forward, from_node: restocking, to_node: shipments, effect: supports, condition: 订单已经交付并在本期确认收入。, recorded_at: *buyer_review}
  - {id: demand_payback, from_node: restocking, to_node: margin, effect: constrains, condition: 备货透支下期需求且公司需降价消化库存。, recorded_at: *buyer_review}
  - {id: cost_margin, from_node: foundry, to_node: margin, effect: constrains, condition: 较高采购成本进入当期销售成本且无法足额转嫁。, recorded_at: *later}
