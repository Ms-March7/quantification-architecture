[project]
name = "news-signal-agent-backend"
version = "0.1.0"
description = "Auditable news signal workflow backend for A-share watchlists."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "apscheduler>=3.10",
  "httpx>=0.27",
  "pypdf>=5.0"
]

[project.scripts]
news-signal-agent = "app.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]
semantic = [
  "sentence-transformers>=3.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"
