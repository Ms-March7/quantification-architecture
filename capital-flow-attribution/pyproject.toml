[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "capital-flow-attribution"
version = "0.2.0"
description = "Point-in-time daily capital-flow state ledger for China-related markets."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2",
  "numpy>=1.24.4,<3",
  "pandas>=2.2,<3",
  "pandera[pandas]>=0.29,<0.33",
  "requests>=2.31,<3",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
china-sources = [
  "akshare>=1.18.64,<1.19",
  "tushare>=1.4.29,<2",
]
research = [
  "networkx>=3.4,<4",
  "scikit-learn>=1.5,<2",
  "ruptures>=1.1.10,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
